name: Branch binaries

# SHELVED. GitHub only runs workflows under .github/workflows/, so this file
# does nothing where it sits. It is kept for the next time installers have to
# be tried from a branch or a pull request before anything is tagged: copy it
# to .github/workflows/binaries.yml, set the branch under `push:` to the one
# being worked on, and push. Each job uploads its installers as a run artifact
# (fourteen days), unsigned: Apple Silicon and Intel disk images, a Windows MSI
# and NSIS installer, a Linux .deb, .rpm and AppImage. Remove it again before
# merging; tagged releases are the job of release.yml, which builds the same
# installers the same way and attaches them to the release.
#
# `workflow_dispatch` only appears in the Actions tab once the file is on the
# default branch, so from a branch the push or the pull-request run (approved
# with "Approve and run" for a fork) is the way to start a build.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/branch-under-test
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  binaries:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-apple-silicon
            platform: macos-14
            target: aarch64-apple-darwin
            bundles: app
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - label: macos-intel
            platform: macos-14
            target: x86_64-apple-darwin
            bundles: app
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - label: windows-x64
            platform: windows-latest
            target: ""
            bundles: msi,nsis
            bundle-dir: src-tauri/target/release/bundle
          - label: linux-x64
            platform: ubuntu-22.04
            target: ""
            bundles: deb,rpm,appimage
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: binaries-${{ matrix.label }}

      - run: npm ci

      - name: Build the desktop bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Tauri's own DMG step drives the Finder through AppleScript, which has no
      # session on a runner. The repository's hdiutil script produces the same
      # named volume without one.
      - name: Package the macOS disk image
        if: startsWith(matrix.label, 'macos')
        env:
          PRINCIPIA_BUNDLE_DIR: ${{ matrix.bundle-dir }}
          PRINCIPIA_DMG_ARCH: ${{ matrix.label == 'macos-intel' && 'x86_64' || 'aarch64' }}
        run: bash scripts/bundle-dmg.sh

      - name: Upload the installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: principia-desk-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
