name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_NET_RETRY: "10"

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Strict Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust and deterministic curriculum tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Frontend type and accessibility checks
        run: npm run check
      - name: Frontend unit tests
        run: npm test
      - name: Production frontend build
        run: npm run build

  platform-gates:
    name: Gates on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - name: Strict Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests (platform scheduler, kiosk and key storage compile paths)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Frontend type and accessibility checks
        run: npm run check
      - name: Frontend unit tests
        run: npm test
