name: Release

# Runs when a version tag is pushed (`git tag v0.2.0 && git push origin v0.2.0`),
# which is also what creating a release in the GitHub interface does, or by hand
# from the Actions tab with a tag that already exists. Nothing builds on ordinary
# pushes. One job verifies the tree; then one job per platform builds the
# installers the way the branch-binaries run proved out, and attaches them to
# a draft release for that tag; the last job writes the updater manifest and
# publishes the release, so `latest` only ever names a complete one:
#
#   macOS      Principia Desk_<v>_aarch64.dmg   Principia Desk_<v>_x86_64.dmg
#   Windows    Principia Desk_<v>_x64_en-US.msi  Principia Desk_<v>_x64-setup.exe
#   Linux      principia-desk_<v>_amd64.deb  principia-desk-<v>-1.x86_64.rpm  principia-desk_<v>_amd64.AppImage
#
# The installers are unsigned for the operating systems (no Apple Developer
# ID, no Windows certificate); the README says how to open them. Separately,
# every installer gets a `.sig` from the key in the TAURI_SIGNING_PRIVATE_KEY
# secret: not a publisher signature, a checksum the desk's own updater
# verifies before it swaps itself for a download. macOS also gets an
# `.app.tar.gz` the updater swaps in, and a last job writes `latest.json`,
# the manifest an installed desk reads to offer the update.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag to build, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write # the release and its assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify the tree
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: The tag names the version the app carries
        run: |
          tag="${RELEASE_TAG#v}"
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag $tag · tauri.conf.json $app · package.json $pkg · Cargo.toml $crate"
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "::error::the tag must match the version in src-tauri/tauri.conf.json, package.json and src-tauri/Cargo.toml; bump them and tag again"
            exit 1
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: release-verify

      - run: npm ci

      - name: Gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          npm run check
          npm test

      # The release is made here, once, as a draft: the installer jobs attach
      # their files to it and the manifest job publishes it. Made from one
      # place so two platforms finishing together cannot make two drafts.
      - name: Open the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists; its files will be replaced"
            exit 0
          fi
          notes="$(node scripts/release-notes.mjs "${RELEASE_TAG#v}" 2>/dev/null || true)"
          printf '%s\n\n%s\n' "${notes:-Principia Desk $RELEASE_TAG}" "Download the installer for your platform from the assets below; an installed desk offers this version itself from Settings. The installers are unsigned for the operating system; the README says how to open them." > release-notes.md
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Principia Desk $RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft

  installers:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-apple-silicon
            platform: macos-14
            target: aarch64-apple-darwin
            bundles: app
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - label: macos-intel
            platform: macos-14
            target: x86_64-apple-darwin
            bundles: app
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - label: windows-x64
            platform: windows-latest
            target: ""
            bundles: msi,nsis
            bundle-dir: src-tauri/target/release/bundle
          - label: linux-x64
            platform: ubuntu-22.04
            target: ""
            bundles: deb,rpm,appimage
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: release-${{ matrix.label }}

      - run: npm ci

      - name: Build the desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The updater archive is named after the app alone, so both Macs would
      # upload the same file name; the architecture goes into it here.
      - name: Name the macOS updater archive per architecture
        if: startsWith(matrix.label, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.label == 'macos-intel' && 'x86_64' || 'aarch64' }}"
          version="${RELEASE_TAG#v}"
          dir="${{ matrix.bundle-dir }}/macos"
          mv "$dir/Principia Desk.app.tar.gz" "$dir/Principia.Desk_${version}_${arch}.app.tar.gz"
          mv "$dir/Principia Desk.app.tar.gz.sig" "$dir/Principia.Desk_${version}_${arch}.app.tar.gz.sig"
          ls -la "$dir"

      # Tauri's own DMG step drives the Finder through AppleScript, which has no
      # session on a runner. The repository's hdiutil script produces the same
      # named volume without one.
      - name: Package the macOS disk image
        if: startsWith(matrix.label, 'macos')
        env:
          PRINCIPIA_BUNDLE_DIR: ${{ matrix.bundle-dir }}
          PRINCIPIA_DMG_ARCH: ${{ matrix.label == 'macos-intel' && 'x86_64' || 'aarch64' }}
        run: bash scripts/bundle-dmg.sh

      - name: Keep the installers with the run too
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: principia-desk-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz.sig
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/msi/*.msi.sig
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/nsis/*.exe.sig
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/deb/*.deb.sig
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/rpm/*.rpm.sig
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/appimage/*.AppImage.sig

      # The draft the verify job opened takes every platform's files;
      # `releases/latest` keeps naming the previous version until the manifest
      # job publishes it, so a desk checking for updates mid-run sees the last
      # complete release, never a half-built one. `--clobber` lets a rerun
      # replace a file.
      - name: Attach the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          shopt -s nullglob
          d="${{ matrix.bundle-dir }}"
          files=( "$d"/dmg/*.dmg "$d"/macos/*.app.tar.gz "$d"/macos/*.app.tar.gz.sig "$d"/msi/*.msi "$d"/msi/*.msi.sig "$d"/nsis/*.exe "$d"/nsis/*.exe.sig "$d"/deb/*.deb "$d"/deb/*.deb.sig "$d"/rpm/*.rpm "$d"/rpm/*.rpm.sig "$d"/appimage/*.AppImage "$d"/appimage/*.AppImage.sig )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers to attach"
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # The manifest the desk's updater reads: one entry per platform and
  # installer kind, each with the download address and the signature the
  # build wrote beside it. Written last, from what the release actually
  # carries, so a platform whose build failed is simply absent.
  manifest:
    name: Updater manifest
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Write latest.json from the release's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p sigs
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          # A draft's asset addresses are temporary; the manifest names the
          # addresses the files have once the release is published.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name' \
            | awk -v base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" '{ print $0 "\t" base $0 }' > assets.tsv
          notes="$(node scripts/release-notes.mjs "$version" 2>/dev/null || echo "Principia Desk $version")"
          python3 - "$version" "$notes" <<'PY'
          import json, os, sys, datetime
          version, notes = sys.argv[1], sys.argv[2]
          assets = {}
          for line in open("assets.tsv"):
              name, url = line.rstrip("\n").split("\t")
              assets[name] = url
          def sig(name):
              path = os.path.join("sigs", name + ".sig")
              return open(path).read().strip() if os.path.exists(path) else None
          def find(**want):
              for name in assets:
                  if all(fn(name) for fn in want.values()):
                      return name
              return None
          platforms = {}
          def add(key, name):
              if not name: return
              s = sig(name)
              if not s:
                  print(f"no signature for {name}; {key} left out")
                  return
              platforms[key] = {"signature": s, "url": assets[name]}
          add("darwin-aarch64", find(a=lambda n: n.endswith(".app.tar.gz") and "aarch64" in n))
          add("darwin-x86_64", find(a=lambda n: n.endswith(".app.tar.gz") and "x86_64" in n))
          nsis = find(a=lambda n: n.endswith("-setup.exe"))
          msi = find(a=lambda n: n.endswith(".msi"))
          add("windows-x86_64", nsis or msi)
          add("windows-x86_64-nsis", nsis)
          add("windows-x86_64-msi", msi)
          appimage = find(a=lambda n: n.endswith(".AppImage"))
          add("linux-x86_64", appimage)
          add("linux-x86_64-appimage", appimage)
          add("linux-x86_64-deb", find(a=lambda n: n.endswith(".deb")))
          add("linux-x86_64-rpm", find(a=lambda n: n.endswith(".rpm")))
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps({k: v["url"] for k, v in platforms.items()}, indent=2))
          PY
          test -s latest.json
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          # Everything is attached: the release goes public and becomes `latest`.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
