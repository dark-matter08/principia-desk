# principia.ndelucien.com — ingress server blocks.
#
# Included by the box-wide vertex nginx through the ndelucien.com drop-in
# directory (`include /etc/nginx/ndelucien.d/*.conf;`, mounted from
# /opt/ndelucien/production/nginx-ndelucien.d), where the deploy workflow
# copies this file as principia.conf. The certificate is ndelucien.com's,
# expanded to cover this name:
#
#   certbot certonly --webroot -w /var/www/certbot --cert-name ndelucien.com \
#     -d ndelucien.com -d admin.ndelucien.com -d api.ndelucien.com \
#     -d supabase.ndelucien.com -d s3.ndelucien.com -d principia.ndelucien.com --expand
#
# The deploy never installs this file before the certificate names the host:
# a server block naming a certificate without it fails `nginx -t`, and the
# next reload for ANY reason then refuses, taking every site on the box down.

# ── HTTP: ACME + redirect to HTTPS ──
server {
    listen 80;
    server_name principia.ndelucien.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://principia.ndelucien.com$request_uri;
    }
}

# ── the site ──
server {
    listen 443 ssl;
    server_name principia.ndelucien.com;

    ssl_certificate     /etc/letsencrypt/live/ndelucien.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ndelucien.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fully qualified, and it matters: vertex_nginx is the only container on
    # the vertex_web overlay without a second membership, so a bare `web`
    # would resolve to whichever stack answered first.
    set $principia_backend "principia_web:9940";

    location / {
        proxy_pass http://$principia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
