# In-container server. TLS, the domain and the redirects are the box's nginx
# job (docker/nginx-principia.conf); this one only serves files on the overlay.
server {
    listen 9940;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro fingerprints its assets, so they can be cached hard; the HTML and
    # the screenshots cannot, or an edit would not reach anyone who had visited.
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Relative Location headers: this server listens on 9940 behind the box's
    # nginx, so an absolute redirect would name its own port and scheme.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        # =404, not /index.html: an unknown path is a 404, not the home page
        # with a 200, which search engines read as a soft 404 for the whole site.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    access_log off;
}
